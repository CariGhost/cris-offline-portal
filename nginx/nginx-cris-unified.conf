server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # =========================================================
    # 1. LANDING PAGE CENTRAL / HUB HOME (Página de inicio)
    # =========================================================
    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    # =========================================================
    # 2. FRONTEND DE E-CHAT (FLUTTER WEB EN MINÚSCULAS)
    # =========================================================
    location /echat {
        alias /var/www/echat/;
        index index.html;
        try_files $uri $uri/ /echat/index.html;
    }

    # =========================================================
    # 3. BACKEND DE E-CHAT (FASTAPI) - PROXY INVERSO
    # =========================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================
    # 4. ARCHIVOS DE LAS CLASES (MULTIMEDIA DESDE EL SSD)
    # =========================================================
    location /uploads/ {
        alias /mnt/ssd/uploads/;
        expires 7d;
    }

    # =========================================================
    # 5. FRONTEND DE LIVE (APP DE BIBLIOTECA)
    # =========================================================
    location /live {
        alias /var/www/live/;
        index index.html;
        try_files $uri $uri/ /live/index.html;
    }

    # =========================================================
    # 6. BACKEND DE LIVE (FASTAPI) - PROXY INVERSO
    # =========================================================
    location /api-live/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
